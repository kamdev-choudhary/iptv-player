# /etc/nginx/sites-available/tuner.conf — see deploy/README.md.
#
#   tv.quartix.in  → /srv/tuner/apps/web/dist   (SPA, real files)
#   /api/          ┐
#   /stream/       ├ 127.0.0.1:12994  (pm2: tuner-api)
#   /admin/        ┘
#
# Three proxy blocks rather than one, because they want opposite things. /api
# is small JSON and should be buffered; /stream is video that must not be, and
# must not time out mid-programme; /admin must never be cached by anything.
#
# Shares nginx's http{} with the other sites on this box. Anything http-level
# declared here would be a duplicate and fatal for every vhost, so there is
# nothing http-level in this file at all.

server {
    listen      80;
    listen      [::]:80;
    server_name tv.quartix.in;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name tv.quartix.in;

    ssl_certificate     /etc/letsencrypt/live/tv.quartix.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.quartix.in/privkey.pem;

    root  /srv/tuner/apps/web/dist;
    index index.html;

    access_log /var/log/nginx/tuner.access.log;
    error_log  /var/log/nginx/tuner.error.log;

    # An imported M3U is the only large body this site accepts.
    client_max_body_size 16m;

    # The application deliberately ships no CSP: it loads logos from hundreds
    # of broadcaster domains and video from as many more, so a useful policy
    # can only be written here, where this deployment's own origin is known.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; frame-ancestors 'none'" always;

    # ── The catalog API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:12994;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── The stream proxy ─────────────────────────────────────────────────────
    # A segment streams for as long as someone watches. Buffering it would add
    # latency and hold the whole response in nginx before a byte reaches the
    # player; a read timeout would cut a long programme off mid-sentence.
    location /stream/ {
        proxy_pass            http://127.0.0.1:12994;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Range             $http_range;
        proxy_set_header      If-Range          $http_if_range;
        proxy_http_version    1.1;
        proxy_buffering       off;
        proxy_request_buffering off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        # The application sets its own; nginx must not add a second one.
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
    }

    # ── The write surface ────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://127.0.0.1:12994;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # a sync or a probe sweep runs for minutes
        proxy_buffering    off;
    }

    # ── The client ───────────────────────────────────────────────────────────
    # Vite emits hashed filenames, so a year is safe for everything under
    # /assets/. index.html is not hashed and must never be cached, or a deploy
    # leaves browsers asking for bundles that are no longer there.
    location ^~ /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # A single-page app: an unknown path is one of its routes, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
