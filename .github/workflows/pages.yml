name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # iptv-org rebuilds its data daily; pick it up a little after.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace an in-flight one rather than stack up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build channel index
        run: node scripts/build-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
