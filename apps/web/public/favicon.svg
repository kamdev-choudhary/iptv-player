<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d26"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="favSignal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55d6e3"/>
      <stop offset="100%" stop-color="#3fd08a"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Chassis -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2a3342" stroke-width="1"/>

  <!-- Top-Right Live Status Tally Dot -->
  <circle cx="24.5" cy="7.5" r="2.5" fill="#3fd08a"/>

  <!-- Stylized IPTV Stream Screen & Play Core -->
  <rect x="6" y="7" width="13" height="11" rx="2.5" fill="#141820" stroke="#334155" stroke-width="1.2"/>
  <polygon points="10,9.5 10,15.5 15,12.5" fill="#4fcfe0"/>

  <!-- Broadcast Signal Waves / Tuning Arcs -->
  <path d="M 22 13 A 5 5 0 0 1 22 18" fill="none" stroke="#4fcfe0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 25 10.5 A 9 9 0 0 1 25 20.5" fill="none" stroke="#4fcfe0" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- Instrument Telemetry Rails / Spectrum Bar -->
  <rect x="6" y="21.5" width="20" height="2.5" rx="1.25" fill="url(#favSignal)"/>
  <rect x="6" y="25.5" width="11" height="2" rx="1" fill="#475569"/>
  <rect x="19" y="25.5" width="7" height="2" rx="1" fill="#334155"/>
</svg>